<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Магазин</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f8}
header{padding:12px;background:#fff;font-weight:700}
.tabs{display:flex;gap:10px;padding:10px;overflow:auto;position:sticky;top:0;background:#f4f6f8;z-index:50}
.tab{background:#e2e8f0;padding:8px 12px;border-radius:10px;cursor:pointer}
.tab.active{background:#cbd5e1;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;padding-bottom:200px}
.card{background:#fff;padding:10px;border-radius:12px}
.price{font-weight:bold;margin:6px 0}
.btn{width:100%;padding:10px;border:0;border-radius:10px;background:#3b82f6;color:#fff;margin-top:6px}
.pimg{width:100%;aspect-ratio:1/1;object-fit:contain;background:#f8fafc;border-radius:12px;margin-bottom:8px}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:2000}
.modal{background:#fff;width:92%;max-width:380px;border-radius:16px;padding:16px;text-align:center}
</style>
</head>

<body>

<header>Магазин</header>

<div id="welcome" class="modal-backdrop">
  <div class="modal">
    <h3>Добро пожаловать!</h3>
    <p>Вы в магазине WAKA Nexa</p>
    <button class="btn" id="startBtn">Начать покупки</button>
  </div>
</div>

<div class="tabs" id="tabs"></div>
<div class="grid" id="products"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) tg.ready();

const BASE_IMG = "https://raw.githubusercontent.com/didar2007/tg-miniapp/main/img1/";

function img(file){
  return BASE_IMG + file;
}

const CATEGORIES = [
{
id:"waka10000",
defaultPrice:12990,
products:[
{ name:"🍏 Sour Apple",ru:"Кислое яблоко",img:"sour-apple10.png"},
{ name:"🔵 Mr. Blue",ru:"Черника",img:"mr-blue10.png"},
{ name:"🥝 Kiwi Mulberry",ru:"Киви",img:"kiwi-mulberry10.jpg"},
{ name:"🍓 Lychee Burst",ru:"Личи",img:"lychee-burst10.jpg"}
]},
{
id:"waka8000",
defaultPrice:10990,
products:[
{ name:"🍒 Cherry",ru:"Вишня",img:"cherry8.jpg"},
{ name:"🍇 Iced Grape",ru:"Виноград",img:"grape8.jpg"},
{ name:"🍓🍉 Strawberry Watermelon",ru:"Клубника Арбуз",img:"straberry_watermelon8.jpg"},
{ name:"🍏 Sour Apple",ru:"Яблоко",img:"apple8.jpg"}
]},
{
id:"waka15000",
defaultPrice:14990,
products:[
{ name:"🌵 Cactus Lemon",ru:"Кактус Лимон",img:"cactus-lemon15.jpg"},
{ name:"🌿 Mint",ru:"Мята",img:"mint15.jpg"}
]},
{
id:"waka20000",
defaultPrice:14990,
products:[
{ name:"🍓 Raspberry",ru:"Малина",img:"straberry-raspberry20.jpg"}
]}
];

function closeWelcome(){
  document.getElementById("welcome").style.display="none";
}

document.getElementById("startBtn").onclick = closeWelcome;

function buildTabs(){
  const tabs=document.getElementById("tabs");
  CATEGORIES.forEach(c=>{
    const el=document.createElement("div");
    el.className="tab";
    el.innerText=c.id;
    el.onclick=()=>loadCategory(c.id);
    tabs.appendChild(el);
  });
}

function loadCategory(id){
  const cat=CATEGORIES.find(c=>c.id===id);
  const box=document.getElementById("products");
  box.innerHTML="";

  cat.products.forEach(p=>{
    box.innerHTML+=`
    <div class="card">
      <img class="pimg" src="${img(p.img)}">
      <b>${p.name}</b>
      <div>${p.ru}</div>
      <div class="price">₸${cat.defaultPrice}</div>
      <button class="btn">В корзину</button>
    </div>`;
  });
}

buildTabs();
loadCategory(CATEGORIES[0].id);
</script>

</body>
</html>
